<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WST Portfolio</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #111;
      }

      img {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 2rem);
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img src="WST-PortfolioNo1.jpg" alt="WST Portfolio">
